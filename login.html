<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Sign in, Arch Dashboard</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  :root{
    --orange:#EC641D; --gold:#FCC76E; --cream:#F3EFD7; --ink:#1f1d1a; --muted:#8a8672; --line:#ece6d8;
  }
  *{box-sizing:border-box;}
  @keyframes riseIn{
    from{opacity:0;transform:translateY(10px);}
    to{opacity:1;transform:translateY(0);}
  }
  @keyframes glow{
    0%,100%{opacity:.35;transform:scale(1);}
    50%{opacity:.6;transform:scale(1.08);}
  }
  @keyframes drift{
    0%{transform:translate(-6%,-4%) scale(1);}
    50%{transform:translate(4%,3%) scale(1.05);}
    100%{transform:translate(-6%,-4%) scale(1);}
  }
  body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:var(--cream);
    color:var(--ink);min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;
    position:relative;overflow:hidden;}
  .field{position:absolute;inset:-10%;pointer-events:none;z-index:0;
    background:radial-gradient(circle at 30% 20%, rgba(236,100,29,.16), transparent 55%),
      radial-gradient(circle at 75% 70%, rgba(252,199,110,.22), transparent 50%);
    animation:drift 16s ease-in-out infinite;}
  .box{position:relative;z-index:1;background:#fff;border:1px solid var(--line);border-radius:14px;
    padding:38px 34px 34px;width:100%;max-width:380px;box-shadow:0 20px 60px -25px rgba(31,29,26,.25);
    animation:riseIn .6s ease-out both;}
  .mark-wrap{position:relative;width:52px;height:40px;margin-bottom:20px;}
  .mark-glow{position:absolute;inset:-14px;border-radius:50%;background:radial-gradient(circle, var(--gold), transparent 70%);
    filter:blur(10px);animation:glow 3.2s ease-in-out infinite;}
  .mark{position:relative;width:52px;height:auto;display:block;}
  .mark path{opacity:0;transform:translateY(6px);transform-origin:center;
    animation:riseIn .55s cubic-bezier(.2,.8,.2,1) forwards;}
  .mark path:nth-child(1){animation-delay:.55s;}
  .mark path:nth-child(2){animation-delay:.38s;}
  .mark path:nth-child(3){animation-delay:.21s;}
  .mark path:nth-child(4){animation-delay:.05s;}
  h1{font-family:Georgia,serif;font-weight:400;font-size:22px;margin:0 0 6px;
    animation:riseIn .6s ease-out .5s both;}
  p.sub{color:var(--muted);font-size:13px;margin:0 0 22px;line-height:1.5;
    animation:riseIn .6s ease-out .6s both;}
  form{animation:riseIn .6s ease-out .7s both;}
  input{width:100%;border:1px solid var(--line);border-radius:8px;padding:11px 13px;font-size:13.5px;
    font-family:inherit;margin-bottom:12px;transition:border-color .15s, box-shadow .15s;}
  input:focus{outline:none;border-color:var(--orange);box-shadow:0 0 0 3px rgba(236,100,29,.12);}
  button{width:100%;background:var(--ink);color:#fff;border:none;border-radius:8px;padding:11px 13px;
    font-size:13.5px;font-weight:600;cursor:pointer;font-family:inherit;transition:background .15s, transform .1s;}
  button:hover{background:var(--orange);}
  button:active{transform:scale(.98);}
  button:disabled{opacity:.6;cursor:default;transform:none;}
  .msg{margin-top:16px;font-size:12.5px;line-height:1.5;padding:11px 13px;border-radius:8px;
    animation:riseIn .35s ease-out both;}
  .msg.ok{background:#e7f2ea;color:#4a7a5f;}
  .msg.err{background:#f7e6e2;color:#b8492f;}
  .msg{display:none;}
</style>
</head>
<body>
  <div class="field"></div>
  <div class="box">
    <div class="mark-wrap">
      <div class="mark-glow"></div>
      <svg class="mark" viewBox="0 0 144 106" fill="none" xmlns="http://www.w3.org/2000/svg">
        <path d="M102.909 105.071H98.112C97.6101 105.071 97.1386 104.816 96.8709 104.384L73.7036 67.1292C73.1591 66.2592 72.3104 66.1649 71.9697 66.1649C71.6321 66.1649 70.7712 66.2562 70.2358 67.1292L47.0685 104.384C46.8008 104.816 46.3293 105.071 45.8274 105.071H41.0303C39.8835 105.071 39.1838 103.809 39.7892 102.835L64.301 63.4363C65.9619 60.7594 68.8335 59.1715 71.9788 59.1715C75.1272 59.1715 77.9958 60.7594 79.6567 63.4363L104.169 102.835C104.774 103.809 104.077 105.071 102.927 105.071H102.909Z" fill="#EC641D"/>
        <path d="M116.102 105.074H111.305C110.803 105.074 110.332 104.819 110.064 104.387L75.1186 48.1965C74.422 47.0801 73.2843 46.4443 71.9702 46.4443C70.6591 46.4443 69.5093 47.0801 68.8218 48.1965L33.8761 104.387C33.6084 104.819 33.1369 105.074 32.635 105.074H27.8379C26.6911 105.074 25.9914 103.812 26.5968 102.839L62.8778 44.5066C64.846 41.34 68.2408 39.4509 71.9702 39.4509C73.8349 39.4509 75.6083 39.9224 77.1779 40.7955C78.7354 41.6655 80.0799 42.9278 81.0625 44.5066L117.341 102.839C117.949 103.812 117.249 105.074 116.102 105.074Z" fill="#EC641D"/>
        <path d="M129.286 105.071H124.489C123.987 105.071 123.516 104.815 123.248 104.383L76.5331 29.26C75.5292 27.6508 73.8683 26.7291 71.9702 26.7291C70.072 26.7291 68.4142 27.6508 67.4073 29.26L20.6954 104.383C20.4278 104.815 19.9563 105.071 19.4543 105.071H14.6572C13.5104 105.071 12.8108 103.809 13.4161 102.835L61.4725 25.558C63.6961 21.9807 67.5107 19.8057 71.7147 19.7236C76.1437 19.6323 80.2655 21.9898 82.6108 25.7527L130.546 102.826C131.151 103.799 130.454 105.062 129.304 105.062L129.286 105.071Z" fill="#EC641D"/>
        <path d="M142.479 105.071H137.681C137.179 105.071 136.708 104.816 136.44 104.384L77.9471 10.3243C76.636 8.2132 74.461 7.00252 71.9697 7.00252C69.4783 7.00252 67.3064 8.2132 65.9923 10.3243L7.50209 104.384C7.2344 104.816 6.7629 105.071 6.26098 105.071H1.46386C0.317055 105.071 -0.382589 103.809 0.222755 102.835L60.0605 6.62228C62.6431 2.48221 67.0935 0 71.9818 0C76.8733 0 81.3206 2.47005 83.9032 6.62228L143.738 102.835C144.343 103.809 143.647 105.071 142.5 105.071H142.479Z" fill="#EC641D"/>
      </svg>
    </div>
    <h1>Arch, Internal</h1>
    <p class="sub">Enter your email and we'll send you a one-time sign-in link. Access is limited to the Arch team and people explicitly invited.</p>
    <form id="loginForm">
      <input id="email" type="email" placeholder="you@arch.network" required autofocus>
      <button id="submitBtn" type="submit">Send sign-in link</button>
    </form>
    <div class="msg ok" id="okMsg">Check your inbox. The link expires in 15 minutes and works once.</div>
    <div class="msg err" id="errMsg">Something went wrong. Try again in a moment.</div>
  </div>

<script>
  const params = new URLSearchParams(location.search);
  const errParam = params.get('error');
  if (errParam) {
    const errMsg = document.getElementById('errMsg');
    const labels = {
      missing_token: 'That link is missing its token, request a new one.',
      invalid_or_expired: 'That link is invalid or already used, request a new one.',
      expired: 'That link expired, request a new one.',
    };
    errMsg.textContent = labels[errParam] || 'That link is no longer valid, request a new one.';
    errMsg.style.display = 'block';
  }

  document.getElementById('loginForm').addEventListener('submit', async (e) => {
    e.preventDefault();
    const btn = document.getElementById('submitBtn');
    const ok = document.getElementById('okMsg');
    const err = document.getElementById('errMsg');
    ok.style.display = 'none';
    err.style.display = 'none';
    btn.disabled = true;
    btn.textContent = 'Sending...';
    try {
      const res = await fetch('/api/auth/request-link', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ email: document.getElementById('email').value }),
      });
      if (res.ok) {
        ok.style.display = 'block';
      } else {
        err.textContent = 'Something went wrong. Try again in a moment.';
        err.style.display = 'block';
      }
    } catch (e2) {
      err.textContent = 'Something went wrong. Try again in a moment.';
      err.style.display = 'block';
    }
    btn.disabled = false;
    btn.textContent = 'Send sign-in link';
  });
</script>
</body>
</html>
